<div class="library-header">
  <div><a class="back" href="{{ url_for('libraries.index') }}">← Libraries</a><h1>{{ library.name }}</h1><span class="role-badge {{ role }}">{{ role|title }}</span></div>
  <nav class="library-nav">
    <a href="{{ url_for('catalog.library_home', library_id=library.id) }}">Movies</a>
    <a href="{{ url_for('catalog.shelves', library_id=library.id) }}">Shelves</a>
    <a href="{{ url_for('catalog.collections', library_id=library.id) }}">Collections</a>
    <a href="{{ url_for('catalog.loans', library_id=library.id) }}">On Loan</a>
    {% if role == 'owner' %}<a href="{{ url_for('libraries.settings', library_id=library.id) }}">Settings</a>{% endif %}
  </nav>
</div>
