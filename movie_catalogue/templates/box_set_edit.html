{% extends 'base.html' %}{% block title %}Edit {{ box_set.title }} · Homebuster{% endblock %}{% block content %}{% include '_library_nav.html' %}<div class="page-heading"><h2>Edit Movie Box Set</h2></div><form method="post" class="panel form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Title<input name="title" value="{{ box_set.title }}" required></label><label>Barcode<input name="barcode" value="{{ box_set.barcode or '' }}"></label><label>Format<input name="format" value="{{ box_set.format or '' }}"></label><label>Edition / version<input name="version" value="{{ box_set.version or '' }}"></label><label>Country<input name="country" value="{{ box_set.country or '' }}"></label><label>Language<input name="language" value="{{ box_set.language or '' }}"></label><label>Region<input name="region" value="{{ box_set.region or '' }}"></label><label>Disc count<input type="number" min="1" name="disc_count" value="{{ box_set.disc_count or '' }}"></label><label>Shelf<select name="shelf_id"><option value="">Unassigned</option>{% for shelf in shelves %}<option value="{{ shelf.id }}" {% if box_set.shelf_id==shelf.id %}selected{% endif %}>{{ shelf.name }}</option>{% endfor %}</select></label><label>Status<select name="status"><option value="owned" {% if box_set.status=='owned' %}selected{% endif %}>Owned</option><option value="wanted" {% if box_set.status=='wanted' %}selected{% endif %}>Wanted</option></select></label><label class="wide">Notes<textarea name="notes">{{ box_set.notes or '' }}</textarea></label><div class="wide"><button class="primary">Save</button> <a class="button" href="{{ url_for('box_sets.detail',library_id=library.id,box_set_id=box_set.id) }}">Cancel</a></div></form>{% endblock %}
