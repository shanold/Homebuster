{% extends 'base.html' %}
{% block content %}
{% include '_library_nav.html' %}
<div class="page-heading"><div><h2>Remove movies from {{ shelf.name }}</h2><p>Selected movies stay in your Library and become Unassigned.</p></div></div>
<form class="filters" method="get"><input name="q" value="{{ q }}" placeholder="Search title, year, or barcode…"><button>Search</button><a class="button" href="{{ url_for('catalog.shelf_remove_movies',library_id=library.id,shelf_id=shelf.id) }}">Reset</a></form>
<form method="post" class="panel">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="toolbar"><button type="button" data-select-all>Select all visible</button><button class="danger">Remove selected from shelf</button><a class="button" href="{{ url_for('catalog.shelf_detail',library_id=library.id,shelf_id=shelf.id) }}">Cancel</a></div>
<div class="list-cards">
{% for movie in movies %}<label class="list-card bulk-choice"><input type="checkbox" name="movie_ids" value="{{ movie.id }}"><div><h3>{{ movie.title }}</h3><p>{{ movie.year or 'Year unknown' }} · {{ movie.format or 'Format unknown' }}</p></div></label>
{% else %}<div class="empty"><h2>No movies on this shelf</h2></div>{% endfor %}
</div>
</form>
<script>document.querySelector('[data-select-all]')?.addEventListener('click',()=>{document.querySelectorAll('input[name="movie_ids"]').forEach(el=>el.checked=true);});</script>
{% endblock %}
